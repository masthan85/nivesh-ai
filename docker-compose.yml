services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nivara
      POSTGRES_USER: nivara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nivara-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivara -d nivara"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://nivara:${POSTGRES_PASSWORD:-nivara-dev-only}@db:5432/nivara
      ENVIRONMENT: development
      AUTO_CREATE_SCHEMA: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
